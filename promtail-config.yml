server:
  disable: true

clients:
- url: "http://loki:3100/loki/api/v1/push"

positions:
  filename: /tmp/positions/positions.yaml

target_config:
  sync_period: 10s

scrape_configs:
- job_name: traefik-logs
  pipeline_stages:
    - json:
        expressions:
          client_host: ClientHost
          user_agent: "\"request_User-Agent\""
          request_path: RequestPath
    - drop:
        source: request_path
        expression: "/metrics"
    - drop:
        source: user_agent
        expression: "Blackbox Exporter.*"
    - geoip:
        source: client_host
        db: /etc/promtail/GeoLite2-City.mmdb
        db_type: city
    - labeldrop:
      - geoip_postal_code
      - geoip_subdivision_code
      - geoip_continent_code
      - geoip_continent_name
      - geoip_subdivision_name
      - geoip_timezone
    # The geoip stage writes its result straight into the label set, so those
    # values are not visible to the structured_metadata stage. A nested match
    # pipeline re-seeds the extracted map from the current labels, which makes
    # it possible to re-attach the high cardinality ones as structured metadata
    # (stored with the log line, not indexed) and drop them as labels.
    - match:
        selector: '{job="traefik"}'
        stages:
        - structured_metadata:
            geoip_city_name:
            geoip_location_latitude:
            geoip_location_longitude:
        - labeldrop:
          - geoip_city_name
          - geoip_location_latitude
          - geoip_location_longitude
    - regex:
        source: user_agent
        expression: "(?P<OS>Windows \\w+ \\d+(?:\\.\\d+)*|Linux(?: (?:i686|x86_64))?|Macintosh|(?:CPU )?iPhone OS|CPU OS.*?like Mac OS X)"
    - regex:
        source: user_agent
        expression: "(?P<Device>iPhone|iPad|Mobile|Android(?: \\d+(?:\\.\\d+)*))"
    - regex:
        source: user_agent
        expression: "(?P<Browser>(MSIE|(?:Mobile )?Safari|Chrome|\\b\\w+\\b Chromium|Firefox|Version|Mobile|GSA|QuickLook|OPR)[ \\\\/](?:[A-Z\\d]+\\b|\\d+(?:\\.\\d+)*))"
    # Only low cardinality fields become labels: every distinct combination of
    # label values creates a stream in Loki, and every stream costs a directory
    # plus at least one chunk file on disk.
    - labels:
        OS:
        Device:
        Browser:
    # client_host, user_agent and request_path are unbounded (request_path even
    # contains the query string), so they are attached as structured metadata.
    # They stay queryable - {host="localhost"} | client_host="1.2.3.4" - and
    # Grafana still shows them, they just don't create streams anymore.
    - structured_metadata:
        client_host:
        user_agent:
        request_path:
  static_configs:
  - targets:
    - localhost
    labels:
      job: traefik
      host: localhost
      __path__: /var/log/*.json
